<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeTec App aktualisieren</title><style>body{font:17px system-ui;background:#f3f6f8;color:#172b40;margin:0;padding:24px}main{max-width:560px;margin:40px auto;background:white;padding:28px;border-radius:16px}button{background:#166534;color:white;border:0;padding:14px 20px;border-radius:8px;font:inherit;cursor:pointer}p{line-height:1.5}</style></head><body><main><h1>Zeiterfassung aktualisieren</h1><p>Dieser Schritt ersetzt die alte App-Version. Bitte vorher offene Formulare abschließen. Andere HeTec-Anwendungen und gespeicherte Anmeldedaten werden nicht gelöscht.</p><button id="start">Jetzt aktualisieren</button><p id="status" role="status"></p><p>Version 2026.09.28-3</p></main><script>
const button=document.getElementById('start'), statusText=document.getElementById('status');
button.addEventListener('click',async()=>{
 button.disabled=true;statusText.textContent='Aktualisierung läuft …';
 try {
  if(!navigator.onLine) throw Error('Bitte zuerst eine Internetverbindung herstellen.');
  if('serviceWorker' in navigator){
   const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
   await reg.update();
   await new Promise((resolve,reject)=>{
    const end=Date.now()+20000;
    const check=()=>{
     if(reg.active?.state==='activated'&&!reg.installing&&!reg.waiting) return resolve();
     if(Date.now()>end) return reject(Error('Update noch nicht bereit. Bitte kurz warten und erneut versuchen.'));
     setTimeout(check,150);
    }; check();
   });
  }
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('zeitkorrektur-')).map(k=>caches.delete(k)));}
  const target=new URL('./index.html',location.href);target.searchParams.set('v',Date.now());
  const response=await fetch(target,{cache:'no-store'});
  if(!response.ok||!(await response.text()).includes('Version 2026.09.28-3')) throw Error('Die neue Version ist noch nicht veröffentlicht. Bitte GitHub Pages prüfen und später erneut versuchen.');
  location.replace(target.href);
 }catch(e){statusText.textContent=e.message;button.disabled=false;}
});
</script></body></html>
